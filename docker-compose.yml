services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drift-rag-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/documents:/app/data/documents
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: drift-rag-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped